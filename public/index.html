<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Web2 Loja</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    form, .busca { margin-bottom: 1.5rem; display: flex; gap: 0.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Produtos</h1>

  <form id="form-produto">
    <input name="nome" placeholder="Nome do produto" required>
    <input name="preco" type="number" step="0.01" placeholder="Preço" required>
    <input name="estoque" type="number" placeholder="Estoque" value="0" required>
    <button type="submit">Salvar</button>
  </form>

  <div class="busca">
    <input id="campo-busca" placeholder="Buscar produto...">
    <button type="button" onclick="carregar()">Buscar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="tabela-produtos"></tbody>
  </table>

  <script>
    const tbody = document.getElementById('tabela-produtos');
    const form = document.getElementById('form-produto');
    const campoBusca = document.getElementById('campo-busca');

    async function carregar() {
      const termo = campoBusca.value.trim();
      const url = termo ? `/produtos?busca=${encodeURIComponent(termo)}` : '/produtos';
      const resp = await fetch(url);
      const produtos = await resp.json();

      tbody.innerHTML = '';
      for (const p of produtos) {
        const tr = document.createElement('tr');

        const tdId = document.createElement('td');
        tdId.textContent = p.id;

        const tdNome = document.createElement('td');
        tdNome.textContent = p.nome;

        const tdPreco = document.createElement('td');
        tdPreco.textContent = Number(p.preco).toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });

        const tdEstoque = document.createElement('td');
        tdEstoque.textContent = p.estoque;

        const tdAcao = document.createElement('td');
        const btnExcluir = document.createElement('button');
        btnExcluir.textContent = 'Excluir';
        btnExcluir.onclick = async () => {
          await fetch(`/produtos/${p.id}`, { method: 'DELETE' });
          carregar();
        };
        tdAcao.append(btnExcluir);

        tr.append(tdId, tdNome, tdPreco, tdEstoque, tdAcao);
        tbody.append(tr);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const dados = Object.fromEntries(new FormData(form));
      await fetch('/produtos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });
      form.reset();
      carregar();
    });

    carregar();
  </script>
</body>
</html>
